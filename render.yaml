services:
  - type: web
    name: sd-study-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBED_BACKEND
        value: local
      - key: LOCAL_EMBED_ENGINE
        value: fastembed
      - key: LOCAL_EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: COLLECTION_LOCAL
        value: system_design_deploy
      # Optional — only used as a generation fallback if Groq is rate-limited.
      # Embeddings no longer depend on Gemini for this deploy; leave blank if unused.
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
